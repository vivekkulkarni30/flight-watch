<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Watch</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="title">Flight Watch</span>
    <form id="search">
      <input id="flight" type="text" placeholder="Flight number, e.g. QF144" aria-label="Flight number">
      <button type="submit">Search</button>
    </form>
    <span id="message" role="status"></span>
  </header>
  <div id="map"></div>
  <footer>For learning only, not for flight planning. · Flight data: <a href="https://opensky-network.org">OpenSky Network</a> · Airports: <a href="https://ourairports.com">OurAirports</a> · Airline data: <a href="https://openflights.org">OpenFlights</a> · Warnings: <a href="https://aviationweather.gov">aviationweather.gov</a></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="map.js"></script>
</body>
</html>
